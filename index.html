<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Bloom Hand & Smile Tracking</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #webcam {
      position: absolute;
      top: -9999px;
      left: -9999px;
      opacity: 0;
      pointer-events: none;
    }
    #overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00f0ff;
      text-align: center;
      padding: 24px;
      background: rgba(10, 10, 15, 0.95);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 8px;
      z-index: 100;
      max-width: 320px;
    }
    #btn-start {
      margin-top: 15px;
      padding: 12px 24px;
      background: #ff2b6d;
      border: none;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      border-radius: 4px;
      font-family: inherit;
      cursor: pointer;
    }
    #btn-start:hover {
      background: #ff5588;
    }
    #btn-start:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #btn-stop {
      margin-top: 10px;
      padding: 8px 18px;
      background: transparent;
      border: 1px solid rgba(0, 240, 255, 0.5);
      color: #00f0ff;
      font-size: 0.85rem;
      border-radius: 4px;
      font-family: inherit;
      cursor: pointer;
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 100;
      display: none;
    }
    #tutorial-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00f0ff;
      text-align: center;
      padding: 28px 24px;
      background: rgba(10, 10, 15, 0.95);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 8px;
      z-index: 110;
      max-width: 340px;
      display: none;
    }
    .tutorial-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      line-height: 1.5;
      margin-bottom: 18px;
    }
    .tutorial-list {
      list-style: none;
      text-align: left;
      color: #00f0ff;
      font-size: 0.9rem;
      line-height: 1.7;
      margin-bottom: 20px;
    }
    .tutorial-list li {
      margin-bottom: 8px;
    }
    .tutorial-btn {
      padding: 12px 24px;
      background: #ff2b6d;
      border: none;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      border-radius: 4px;
      font-family: inherit;
      cursor: pointer;
    }
    .tutorial-btn:hover {
      background: #ff5588;
    }
  </style>

  <!-- MediaPipe CDN Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="stage">
    <div id="overlay">
      <p id="status-text">Click to start tracking</p>
      <button id="btn-start" onclick="initApp()">Start Webcam</button>
    </div>
    <button id="btn-stop" onclick="stopApp()">Stop Camera</button>

    <div id="tutorial-overlay">
      <div id="tutorial-content"></div>
    </div>

    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const statusText = document.getElementById('status-text');
    const btnStart = document.getElementById('btn-start');
    const btnStop = document.getElementById('btn-stop');
    const tutorialOverlay = document.getElementById('tutorial-overlay');
    const tutorialContent = document.getElementById('tutorial-content');

    let tutorialShown = false;

    function showWelcomeAndTutorial() {
      return new Promise((resolve) => {
        const screens = [
          `<p class="tutorial-title">🌸 Snehanshu presents you some Flowers 🌸</p>
           <button class="tutorial-btn" id="tutorial-next">Continue</button>`,
          `<p class="tutorial-title">How it works</p>
           <ul class="tutorial-list">
             <li>🤏 Pinch your thumb and index finger together to bloom flowers from your fingertips</li>
             <li>✊ Make a fist to close the flowers</li>
             <li>👉 Point at an icon in the top bar and pinch to switch the flower type</li>
             <li>😊 Smile at the camera for a little surprise</li>
           </ul>
           <button class="tutorial-btn" id="tutorial-start">Start Blooming</button>`
        ];

        let idx = 0;

        function paint() {
          tutorialContent.innerHTML = screens[idx];
          const btn = tutorialContent.querySelector('button');
          btn.addEventListener('click', () => {
            idx++;
            if (idx < screens.length) {
              paint();
            } else {
              tutorialOverlay.style.display = 'none';
              resolve();
            }
          });
        }

        tutorialOverlay.style.display = 'block';
        paint();
      });
    }

    if (!ctx.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
        this.beginPath();
        this.moveTo(x + r.tl, y);
        this.lineTo(x + w - r.tr, y);
        this.arcTo(x + w, y, x + w, y + r.tr, r.tr);
        this.lineTo(x + w, y + h - r.br);
        this.arcTo(x + w, y + h, x + w - r.br, y + h, r.br);
        this.lineTo(x + r.bl, y + h);
        this.arcTo(x, y + h, x, y + h - r.bl, r.bl);
        this.lineTo(x, y + r.tl);
        this.arcTo(x, y, x + r.tl, y, r.tl);
        this.closePath();
        return this;
      };
    }

    const FINGERTIPS = [4, 8, 12, 16, 20];
    const FINGER_MCP = [2, 5, 9, 13, 17];

    const CONFIG = {
      smoothingRate: 0.22,
      smileSmoothingRate: 0.18,
      smileRatioMin: 0.38,
      smileRatioMax: 0.48,
      fistTipRatioThreshold: 1.25,
      pinchRatioMin: 0.32,
      pinchRatioMax: 1.30,
      airTapPinchFactor: 0.35,
      airTapCooldownMs: 400
    };

    const FLOWER_TYPES = [
      { name: 'Rose', emoji: '🌹', petals: 6, primaryColor: 'rgba(255, 30, 80, 0.95)', midColor: 'rgba(255, 70, 120, 0.7)', glow: '#ff1e50', pistil: '#fff4f8' },
      { name: 'Lotus', emoji: '🪷', petals: 8, primaryColor: 'rgba(255, 100, 200, 0.95)', midColor: 'rgba(200, 50, 255, 0.7)', glow: '#ff64c8', pistil: '#ffeb3b' },
      { name: 'Daisy', emoji: '🌼', petals: 12, primaryColor: 'rgba(255, 255, 255, 0.95)', midColor: 'rgba(255, 230, 150, 0.7)', glow: '#ffe600', pistil: '#ffaa00' },
      { name: 'Sakura', emoji: '🌸', petals: 5, primaryColor: 'rgba(255, 170, 200, 0.95)', midColor: 'rgba(255, 120, 160, 0.7)', glow: '#ffaac8', pistil: '#ffffff' }
    ];



      let currentFlowerIdx = 0;
    let smoothSmile = 0;
    let lastTapTime = 0;
    let smoothBouquet = 0;
    let prevBouquetActive = false;

    class Particle {
      constructor(x, y, color, isBurst = false) {
        this.x = x;
        this.y = y;
        const angle = isBurst ? Math.random() * Math.PI * 2 : -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
        const speed = isBurst ? 1.5 + Math.random() * 4.0 : 0.4 + Math.random() * 1.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - (isBurst ? 0 : 0.3);
        this.size = (1.5 + Math.random() * 3.0) * (isBurst ? 1.4 : 1.0);
        this.alpha = 1.0;
        this.decay = isBurst ? 0.012 + Math.random() * 0.015 : 0.008 + Math.random() * 0.015;
        this.color = color || '#00f0ff';
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy -= 0.012;
        this.vx *= 0.98;
        this.alpha -= this.decay;
      }
      draw(c) {
        if (this.alpha <= 0) return;
        c.save();
        c.globalAlpha = Math.max(0, this.alpha);
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fillStyle = this.color;
        c.shadowColor = this.color;
        c.shadowBlur = 10;
        c.fill();
        c.restore();
      }
    }

    const particles = [];

    function spawnParticles(x, y, color, count = 1, isBurst = false) {
      if (particles.length > 300) return;
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, isBurst));
      }
    }

    const handState = [
      { smoothBloom: 0, smoothGrow: 0 },
      { smoothBloom: 0, smoothGrow: 0 }
    ];

    let latestHandResults = null;
    let latestFaceResults = null;
    let mediaStream = null;
    let appRunning = false;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function dist(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    function drawNeonRibbon(x, y, radius, time) {
      if (radius <= 2) return;
      ctx.save();
      ctx.translate(x, y);

      // Ribbon ring glow
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(8, radius), 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 43, 109, 0.9)';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#ff2b6d';
      ctx.shadowBlur = 20;
      ctx.stroke();

      // Inner cyan accent ring
      const pulse = Math.sin(time * 0.006) * 3;
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(4, radius * 0.65 + pulse), 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.95)';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 15;
      ctx.stroke();

      // Decorative ribbon loops / bow
      ctx.beginPath();
      ctx.ellipse(-radius * 0.7, radius * 0.35, radius * 0.65, radius * 0.3, -Math.PI / 4, 0, Math.PI * 2);
      ctx.ellipse(radius * 0.7, radius * 0.35, radius * 0.65, radius * 0.3, Math.PI / 4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 43, 109, 0.45)';
      ctx.shadowColor = '#ff2b6d';
      ctx.shadowBlur = 14;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.restore();
    }

    function drawFlower(x, y, maxRadius, bloomProgress, flowerConfig, time) {
      if (bloomProgress <= 0.05) return;

      if (Math.random() < 0.25) {
        spawnParticles(x, y, flowerConfig.glow, 1, false);
      }

      const numPetals = flowerConfig.petals;
      const baseRadius = maxRadius * bloomProgress;

      ctx.save();
      ctx.translate(x, y);

      for (let i = 0; i < numPetals; i++) {
        const angle = (i * (Math.PI * 2)) / numPetals + Math.sin(time * 0.003 + i) * 0.08;
        const petalLen = baseRadius * 1.5;
        const petalWidth = baseRadius * (numPetals > 8 ? 0.35 : 0.55);

        ctx.save();
        ctx.rotate(angle);

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-petalWidth, petalLen * 0.4, -petalWidth * 0.8, petalLen, 0, petalLen * 1.2);
        ctx.bezierCurveTo(petalWidth * 0.8, petalLen, petalWidth, petalLen * 0.4, 0, 0);

        const grad = ctx.createLinearGradient(0, 0, 0, petalLen);
        grad.addColorStop(0, flowerConfig.primaryColor);
        grad.addColorStop(0.6, flowerConfig.midColor);
        grad.addColorStop(1, 'rgba(255, 255, 255, 0.15)');

        ctx.fillStyle = grad;
        ctx.shadowColor = flowerConfig.glow;
        ctx.shadowBlur = 15;
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(0, 0, baseRadius * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = flowerConfig.pistil;
      ctx.shadowColor = flowerConfig.glow;
      ctx.shadowBlur = 20;
      ctx.fill();

      ctx.restore();
    }

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const time = performance.now();

      if (video.readyState >= 2) {
        ctx.save();
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, w, h);
        ctx.restore();
      } else {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);
      }

      // Update & render active particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      if (latestFaceResults && latestFaceResults.multiFaceLandmarks && latestFaceResults.multiFaceLandmarks.length > 0) {
        const facePts = latestFaceResults.multiFaceLandmarks[0].map(p => ({ x: (1 - p.x) * w, y: p.y * h }));

        const mouthWidth = dist(facePts[61], facePts[291]);
        const faceWidth = dist(facePts[234], facePts[454]);
        const smileRatio = mouthWidth / (faceWidth || 1);

        let targetSmile = (smileRatio - CONFIG.smileRatioMin) / (CONFIG.smileRatioMax - CONFIG.smileRatioMin);
        targetSmile = Math.max(0, Math.min(1, targetSmile));

        smoothSmile += (targetSmile - smoothSmile) * CONFIG.smileSmoothingRate;
      } else {
        smoothSmile += (0 - smoothSmile) * CONFIG.smileSmoothingRate;
      }

      const buttonWidth = 70;
      const buttonHeight = 70;
      const buttonY = 50;
      const totalBarWidth = FLOWER_TYPES.length * (buttonWidth + 15);
      const startX = (w - totalBarWidth) / 2;

      const buttons = FLOWER_TYPES.map((flower, idx) => ({
        idx,
        flower,
        x: startX + idx * (buttonWidth + 15),
        y: buttonY,
        w: buttonWidth,
        h: buttonHeight,
        hovered: false
      }));

      let targetBouquet = 0;
      let handData = [];

      if (latestHandResults && latestHandResults.multiHandLandmarks && latestHandResults.multiHandLandmarks.length > 0) {
        latestHandResults.multiHandLandmarks.forEach((landmarks, handIdx) => {
          const state = handState[handIdx] || (handState[handIdx] = { smoothBloom: 0, smoothGrow: 0 });

          const pts = landmarks.map(p => ({ x: (1 - p.x) * w, y: p.y * h }));
          const wrist = pts[0];
          const thumbTip = pts[4];
          const indexTip = pts[8];
          const middleMcp = pts[9];

          const palmHeight = Math.max(15, dist(wrist, middleMcp));
          const palmCenter = { x: (wrist.x + middleMcp.x) / 2, y: (wrist.y + middleMcp.y) / 2 };

          const pinchDist = dist(thumbTip, indexTip);
          const isAirTapping = pinchDist < palmHeight * CONFIG.airTapPinchFactor;

          let isHoveringTopBar = false;

          buttons.forEach((btn) => {
            const isHovered = (
              indexTip.x >= btn.x &&
              indexTip.x <= btn.x + btn.w &&
              indexTip.y >= btn.y &&
              indexTip.y <= btn.y + btn.h
            );

            if (isHovered) {
              isHoveringTopBar = true;
              btn.hovered = true;

              if (isAirTapping && time - lastTapTime > CONFIG.airTapCooldownMs) {
                currentFlowerIdx = btn.idx;
                lastTapTime = time;
              }
            }
          });

          let totalTipDist = 0;
          FINGERTIPS.forEach(tipIdx => {
            totalTipDist += dist(wrist, pts[tipIdx]) / palmHeight;
          });
          const avgTipRatio = totalTipDist / FINGERTIPS.length;
          const isFist = avgTipRatio < CONFIG.fistTipRatioThreshold;

          let targetBloom = 0;
          let targetGrow = 0;

          if (!isFist && !isHoveringTopBar) {
            const pinchRatio = pinchDist / palmHeight;
            targetBloom = (pinchRatio - CONFIG.pinchRatioMin) / (CONFIG.pinchRatioMax - CONFIG.pinchRatioMin);
            targetBloom = Math.max(0, Math.min(1, targetBloom));
            targetGrow = Math.max(0.1, targetBloom);
          }

          state.smoothBloom += (targetBloom - state.smoothBloom) * CONFIG.smoothingRate;
          state.smoothGrow += (targetGrow - state.smoothGrow) * CONFIG.smoothingRate;

          handData.push({
            handIdx,
            landmarks,
            pts,
            wrist,
            middleMcp,
            palmCenter,
            palmHeight,
            indexTip,
            isAirTapping,
            state
          });
        });

        if (handData.length === 2) {
          const avgPalmHeight = (handData[0].palmHeight + handData[1].palmHeight) / 2;
          const palmDist = dist(handData[0].palmCenter, handData[1].palmCenter);
          const proxThreshold = avgPalmHeight * 1.6;

          if (palmDist < proxThreshold) {
            targetBouquet = Math.max(0, Math.min(1, (proxThreshold - palmDist) / (proxThreshold * 0.45)));
          }
        }

        for (let i = handData.length; i < handState.length; i++) {
          handState[i].smoothBloom += (0 - handState[i].smoothBloom) * CONFIG.smoothingRate;
          handState[i].smoothGrow += (0 - handState[i].smoothGrow) * CONFIG.smoothingRate;
        }
      } else {
        handState.forEach(state => {
          state.smoothBloom += (0 - state.smoothBloom) * CONFIG.smoothingRate;
          state.smoothGrow += (0 - state.smoothGrow) * CONFIG.smoothingRate;
        });
      }

      smoothBouquet += (targetBouquet - smoothBouquet) * CONFIG.smoothingRate;

      const activeFlower = FLOWER_TYPES[currentFlowerIdx];

      // Draw index finger air-tap cursors
      handData.forEach(h => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(h.indexTip.x, h.indexTip.y, h.isAirTapping ? 12 : 8, 0, Math.PI * 2);
        ctx.fillStyle = h.isAirTapping ? '#ff2b6d' : '#00f0ff';
        ctx.shadowColor = h.isAirTapping ? '#ff2b6d' : '#00f0ff';
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.restore();
      });

      if (handData.length > 0) {
        if (handData.length === 2 && smoothBouquet > 0.05) {
          // --- TWO-HANDED BOUQUET MODE ---
          const centralPoint = {
            x: (handData[0].palmCenter.x + handData[1].palmCenter.x) / 2,
            y: (handData[0].palmCenter.y + handData[1].palmCenter.y) / 2
          };
          const avgPalmHeight = (handData[0].palmHeight + handData[1].palmHeight) / 2;

          // Trigger stardust particle burst on Bouquet Mode activation
          if (smoothBouquet > 0.3 && !prevBouquetActive) {
            prevBouquetActive = true;
            spawnParticles(centralPoint.x, centralPoint.y, '#ffd700', 30, true);
            spawnParticles(centralPoint.x, centralPoint.y, activeFlower.glow, 15, true);
          } else if (smoothBouquet <= 0.1) {
            prevBouquetActive = false;
          }

          // Render ribbon wrap at central holding point
          drawNeonRibbon(centralPoint.x, centralPoint.y, avgPalmHeight * 0.45 * smoothBouquet, time);

          // Collect all 10 fingertips across both hands
          const allFingers = [];
          handData.forEach(h => {
            FINGERTIPS.forEach((tipIdx, fIdx) => {
              const tip = h.pts[tipIdx];
              const mcp = h.pts[FINGER_MCP[fIdx]];
              allFingers.push({
                tip,
                mcp,
                wrist: h.wrist,
                state: h.state,
                handIdx: h.handIdx
              });
            });
          });

          // Sort fingertips left-to-right for clean arch distribution
          allFingers.sort((a, b) => a.tip.x - b.tip.x);

          const avgGrow = (handData[0].state.smoothGrow + handData[1].state.smoothGrow) / 2;
          const avgBloom = (handData[0].state.smoothBloom + handData[1].state.smoothBloom) / 2;
          const flowerMaxSize = avgPalmHeight * 0.5;

          allFingers.forEach((finger, i) => {
            const singleTargetX = finger.wrist.x + (finger.tip.x - finger.wrist.x) * finger.state.smoothGrow;
            const singleTargetY = finger.wrist.y + (finger.tip.y - finger.wrist.y) * finger.state.smoothGrow;

            const archAngle = -Math.PI / 2 + ((i - 4.5) / 4.5) * (Math.PI * 0.38);
            const bouquetRadius = avgPalmHeight * 2.3 * Math.max(0.15, avgGrow);
            const bouquetTargetX = centralPoint.x + Math.cos(archAngle) * bouquetRadius;
            const bouquetTargetY = centralPoint.y + Math.sin(archAngle) * bouquetRadius;

            const startX = finger.wrist.x + (centralPoint.x - finger.wrist.x) * smoothBouquet;
            const startY = finger.wrist.y + (centralPoint.y - finger.wrist.y) * smoothBouquet;

            const targetX = singleTargetX + (bouquetTargetX - singleTargetX) * smoothBouquet;
            const targetY = singleTargetY + (bouquetTargetY - singleTargetY) * smoothBouquet;

            const currentBloom = finger.state.smoothBloom + (avgBloom - finger.state.smoothBloom) * smoothBouquet;
            const currentGrow = finger.state.smoothGrow + (avgGrow - finger.state.smoothGrow) * smoothBouquet;

            if (currentGrow > 0.05) {
              ctx.save();
              ctx.shadowColor = smoothBouquet > 0.5 ? 'rgba(255, 43, 109, 0.9)' : 'rgba(0, 240, 255, 0.9)';
              ctx.shadowBlur = 14;
              ctx.lineWidth = 3;

              ctx.beginPath();
              ctx.moveTo(startX, startY);
              const ctrlX = (startX + targetX) / 2 + Math.sin(time * 0.002 + i) * (12 * (1 - smoothBouquet * 0.5));
              const ctrlY = (startY + targetY) / 2;

              ctx.quadraticCurveTo(ctrlX, ctrlY, targetX, targetY);

              const vineGrad = ctx.createLinearGradient(startX, startY, targetX, targetY);
              vineGrad.addColorStop(0, smoothBouquet > 0.5 ? 'rgba(255, 43, 109, 0.3)' : 'rgba(0, 180, 255, 0.15)');
              vineGrad.addColorStop(1, smoothBouquet > 0.5 ? 'rgba(255, 120, 180, 0.95)' : 'rgba(0, 255, 230, 0.95)');
              ctx.strokeStyle = vineGrad;
              ctx.stroke();
              ctx.restore();
            }

            if (currentBloom > 0.05) {
              drawFlower(targetX, targetY, flowerMaxSize, currentBloom, activeFlower, time);
            }
          });

          if (avgBloom > 0.15) {
            ctx.save();
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, avgBloom * 1.3)})`;
            ctx.shadowColor = '#ff2b6d';
            ctx.shadowBlur = 22;
            ctx.font = 'bold 28px "Courier New", monospace';
            ctx.textAlign = 'center';
            const msg = smoothBouquet > 0.5 ? 'A bouquet for you 💐' : `For you ${activeFlower.emoji}`;
            ctx.fillText(msg, centralPoint.x, centralPoint.y + avgPalmHeight * 1.1);
            ctx.restore();
          }

        } else {
          // --- SINGLE-HAND INDEPENDENT MODE ---
          handData.forEach(h => {
            if (h.state.smoothGrow > 0.05) {
              ctx.save();
              ctx.shadowColor = 'rgba(0, 240, 255, 0.9)';
              ctx.shadowBlur = 14;
              ctx.lineWidth = 3;

              FINGERTIPS.forEach((tipIdx, i) => {
                const tip = h.pts[tipIdx];
                const mcp = h.pts[FINGER_MCP[i]];

                const targetX = h.wrist.x + (tip.x - h.wrist.x) * h.state.smoothGrow;
                const targetY = h.wrist.y + (tip.y - h.wrist.y) * h.state.smoothGrow;

                ctx.beginPath();
                ctx.moveTo(h.wrist.x, h.wrist.y);
                const ctrlX = (h.wrist.x + mcp.x) / 2 + Math.sin(time * 0.002 + i) * 12;
                const ctrlY = (h.wrist.y + mcp.y) / 2;

                ctx.quadraticCurveTo(ctrlX, ctrlY, targetX, targetY);

                const vineGrad = ctx.createLinearGradient(h.wrist.x, h.wrist.y, targetX, targetY);
                vineGrad.addColorStop(0, 'rgba(0, 180, 255, 0.15)');
                vineGrad.addColorStop(1, 'rgba(0, 255, 230, 0.95)');
                ctx.strokeStyle = vineGrad;
                ctx.stroke();
              });
              ctx.restore();
            }

            if (h.state.smoothBloom > 0.05) {
              const flowerMaxSize = h.palmHeight * 0.5;
              FINGERTIPS.forEach((tipIdx) => {
                const tip = h.pts[tipIdx];
                const currentHeadX = h.wrist.x + (tip.x - h.wrist.x) * h.state.smoothGrow;
                const currentHeadY = h.wrist.y + (tip.y - h.wrist.y) * h.state.smoothGrow;

                drawFlower(currentHeadX, currentHeadY, flowerMaxSize, h.state.smoothBloom, activeFlower, time);
              });
            }

            if (h.state.smoothBloom > 0.2) {
              ctx.save();
              ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, h.state.smoothBloom * 1.2)})`;
              ctx.shadowColor = activeFlower.glow;
              ctx.shadowBlur = 18;
              ctx.font = 'bold 26px "Courier New", monospace';
              ctx.textAlign = 'center';
              ctx.fillText(`For you ${activeFlower.emoji}`, h.palmCenter.x, h.wrist.y + 60);
              ctx.restore();
            }
          });
        }
      }

      // Glassmorphic Top Dock container bar
      const dockPadding = 12;
      const dockX = startX - dockPadding;
      const dockY = buttonY - dockPadding;
      const dockWidth = totalBarWidth + dockPadding * 2 - 15;
      const dockHeight = buttonHeight + dockPadding * 2;

      ctx.save();
      ctx.beginPath();
      ctx.roundRect(dockX, dockY, dockWidth, dockHeight, 18);
      ctx.fillStyle = 'rgba(10, 12, 24, 0.65)';
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 18;
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      buttons.forEach((btn) => {
        const isSelected = btn.idx === currentFlowerIdx;
        const scale = isSelected ? 1.08 : (btn.hovered ? 1.05 : 1.0);

        ctx.save();
        ctx.translate(btn.x + btn.w / 2, btn.y + btn.h / 2);
        ctx.scale(scale, scale);

        ctx.beginPath();
        ctx.roundRect(-btn.w / 2, -btn.h / 2, btn.w, btn.h, 14);

        if (isSelected) {
          const pulseGlow = 16 + Math.sin(time * 0.005) * 6;
          ctx.fillStyle = 'rgba(0, 240, 255, 0.3)';
          ctx.strokeStyle = '#00f0ff';
          ctx.shadowColor = '#00f0ff';
          ctx.shadowBlur = pulseGlow;
        } else if (btn.hovered) {
          ctx.fillStyle = 'rgba(255, 43, 109, 0.3)';
          ctx.strokeStyle = '#ff2b6d';
          ctx.shadowColor = '#ff2b6d';
          ctx.shadowBlur = 14;
        } else {
          ctx.fillStyle = 'rgba(20, 22, 38, 0.55)';
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
          ctx.shadowBlur = 0;
        }

        ctx.lineWidth = isSelected || btn.hovered ? 2.5 : 1;
        ctx.fill();
        ctx.stroke();

        ctx.font = isSelected ? '32px "Courier New"' : '24px "Courier New"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(btn.flower.emoji, 0, 0);
        ctx.restore();
      });

      if (smoothSmile > 0.3) {
        ctx.save();
        ctx.fillStyle = `rgba(255, 225, 80, ${Math.min(1, smoothSmile * 1.5)})`;
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 24;
        ctx.font = 'bold 30px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('happy you smiled ✨', w / 2, h - 70);
        ctx.restore();
      }

      if (appRunning) {
        requestAnimationFrame(render);
      }
    }

    let isProcessing = false;
    let frameCount = 0;

    async function initApp() {
      try {
        btnStart.disabled = true;
        statusText.innerText = "Accessing camera...";

        if (typeof Hands === 'undefined' || typeof FaceMesh === 'undefined') {
          throw new Error('Tracking models failed to load from CDN. Check your connection or ad blocker and reload.');
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        mediaStream = stream;

        video.srcObject = stream;
        await video.play();

        statusText.innerText = "Loading AI models...";

        const hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
          maxNumHands: 2,
          modelComplexity: 1,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        hands.onResults((results) => { latestHandResults = results; });

        const faceMesh = new FaceMesh({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });
        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        faceMesh.onResults((results) => { latestFaceResults = results; });

        appRunning = true;

        async function runAI() {
          if (!appRunning) return;
          if (video.readyState >= 2 && !isProcessing) {
            isProcessing = true;
            try {
              frameCount++;
              await hands.send({ image: video });
              if (frameCount % 2 === 0) {
                await faceMesh.send({ image: video });
              }
            } catch (e) {
              console.warn('Inference error:', e);
            }
            isProcessing = false;
          }
          requestAnimationFrame(runAI);
        }

        runAI();
        overlay.style.display = 'none';
        render();

        if (!tutorialShown) {
          await showWelcomeAndTutorial();
          tutorialShown = true;
        }

        btnStop.style.display = 'block';

      } catch (err) {
        console.error(err);
        btnStart.disabled = false;
        statusText.innerHTML = `<span style="color: #ff3366;">Error: ${err.message}</span>`;
      }
    }

    function stopApp() {
      appRunning = false;
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      video.srcObject = null;
      latestHandResults = null;
      latestFaceResults = null;
      handState.forEach(s => { s.smoothBloom = 0; s.smoothGrow = 0; });
      smoothSmile = 0;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      btnStop.style.display = 'none';
      overlay.style.display = 'block';
      btnStart.disabled = false;
      statusText.innerText = "Click to start tracking";
    }

    window.initApp = initApp;
    window.stopApp = stopApp;

    window.addEventListener('beforeunload', () => {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
    });
  </script>
</body>
</html>

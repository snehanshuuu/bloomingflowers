<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Bloom — Gesture-Driven Botanical Garden</title>

  <!-- Google Fonts: Space Grotesk & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-void: #0a1210;
      --cyan-neon: #2ee6a6;
      --pink-hot: #e63968;
      --solar-gold: #ffb703;
      --glass-bg: rgba(12, 24, 20, 0.82);
      --glass-border: rgba(46, 230, 166, 0.35);
      --font-display: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg-void);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--font-mono);
      color: #fff;
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #webcam {
      position: absolute;
      top: -9999px;
      left: -9999px;
      opacity: 0;
      pointer-events: none;
    }

    /* UNIFIED RESPONSIVE HEADER BAR */
    #app-header {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 120;
      pointer-events: none;
    }

    #app-header > * {
      pointer-events: auto;
    }

    /* GLASSMORPHIC FLOWER SELECTION DOCK */
    .glass-dock {
      display: flex;
      gap: clamp(6px, 1.8vw, 14px);
      padding: 8px 14px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .dock-btn {
      width: clamp(46px, 9vw, 64px);
      height: clamp(46px, 9vw, 64px);
      border-radius: 14px;
      background: rgba(20, 24, 40, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .dock-btn:hover,
    .dock-btn.hovered {
      background: rgba(230, 57, 104, 0.25);
      border-color: var(--pink-hot);
      box-shadow: 0 0 14px rgba(230, 57, 104, 0.5);
      transform: translateY(-2px) scale(1.05);
    }

    .dock-btn.active {
      background: rgba(46, 230, 166, 0.25);
      border-color: var(--cyan-neon);
      box-shadow: 0 0 20px rgba(46, 230, 166, 0.6);
      transform: scale(1.08);
      animation: pulseGlow 2.5s infinite alternate;
    }

    @keyframes pulseGlow {
      0% {
        box-shadow: 0 0 14px rgba(46, 230, 166, 0.5);
      }

      100% {
        box-shadow: 0 0 26px rgba(46, 230, 166, 0.9);
      }
    }

    .dock-emoji {
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
      line-height: 1;
    }

    .dock-label {
      font-size: clamp(0.5rem, 0.9vw, 0.68rem);
      font-family: var(--font-mono);
      color: rgba(255, 255, 255, 0.8);
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* CONTROL BUTTONS */
    .cyber-btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      color: var(--cyan-neon);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
    }

    .cyber-btn-icon:hover {
      background: rgba(0, 240, 255, 0.25);
      border-color: var(--cyan-neon);
      box-shadow: 0 0 16px var(--cyan-neon);
      transform: scale(1.1);
    }

    .cyber-btn-stop {
      padding: 10px 18px;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 43, 109, 0.5);
      color: var(--pink-hot);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      display: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .cyber-btn-stop:hover {
      background: rgba(255, 43, 109, 0.25);
      border-color: var(--pink-hot);
      box-shadow: 0 0 16px var(--pink-hot);
    }

    /* START & OVERLAY MODALS */
    #overlay, #tutorial-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 150;
      width: calc(100% - 32px);
      max-width: 420px;
    }

    .glass-card {
      background: rgba(10, 12, 22, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 255, 0.15);
      animation: cardAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: scale(0.92) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .cyber-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 20px;
      color: var(--cyan-neon);
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 2.1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
    }

    .brand-subtitle {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* CYBER SPINNER LOADER */
    .spinner-box {
      margin: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cyber-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0, 240, 255, 0.15);
      border-top-color: var(--cyan-neon);
      border-right-color: var(--pink-hot);
      border-radius: 50%;
      animation: cyberSpin 0.9s linear infinite;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    @keyframes cyberSpin {
      to { transform: rotate(360deg); }
    }

    .status-text {
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--cyan-neon);
      letter-spacing: 0.5px;
    }

    .cyber-btn-primary {
      margin-top: 10px;
      width: 100%;
      padding: 14px 28px;
      background: linear-gradient(135deg, var(--pink-hot), #d6004c);
      border: none;
      color: #fff;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.05rem;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 43, 109, 0.4);
      transition: all 0.25s ease;
    }

    .cyber-btn-primary:hover {
      background: linear-gradient(135deg, #ff5588, #ff2b6d);
      box-shadow: 0 0 25px rgba(255, 43, 109, 0.7);
      transform: translateY(-2px);
    }

    .cyber-btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* TUTORIAL MODAL */
    .tutorial-list {
      list-style: none;
      text-align: left;
      margin: 18px 0 24px 0;
      font-size: 0.88rem;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.9);
    }

    .tutorial-list li {
      margin-bottom: 10px;
      padding-left: 8px;
      border-left: 2px solid var(--cyan-neon);
    }

    /* FEEDBACK LIVE PILL AT BOTTOM */
    #feedback-pill {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 120;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      font-size: 0.82rem;
      color: var(--cyan-neon);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      transition: all 0.3s ease;
    }

    #feedback-icon {
      font-size: 1.1rem;
    }
  </style>

  <!-- MediaPipe CDN Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="stage">
    <!-- HEADER BAR -->
    <header id="app-header">
      <button id="btn-help" class="cyber-btn-icon" title="Gesture Guide">?</button>

      <div id="flower-dock" class="glass-dock">
        <!-- Dynamic Flower Selection Buttons -->
      </div>

      <button id="btn-stop" class="cyber-btn-stop">Stop Camera</button>
    </header>

    <!-- START OVERLAY -->
    <div id="overlay">
      <div class="glass-card">
        <span class="cyber-badge">Digital Garden v2.0</span>
        <h1 class="brand-title">CYBER BLOOM</h1>
        <p class="brand-subtitle">Interactive Holographic Hand & Smile Vision Experience</p>

        <div id="spinner-box" class="spinner-box" style="display: none;">
          <div class="cyber-spinner"></div>
          <p id="status-text" class="status-text">Accessing camera...</p>
        </div>

        <button id="btn-start" class="cyber-btn-primary">Start Webcam</button>
      </div>
    </div>

    <!-- TUTORIAL OVERLAY -->
    <div id="tutorial-overlay" style="display: none;">
      <div class="glass-card">
        <div id="tutorial-content"></div>
      </div>
    </div>

    <!-- LIVE GESTURE FEEDBACK PILL -->
    <div id="feedback-pill" style="display: none;">
      <span id="feedback-icon">✋</span>
      <span id="feedback-text">Scanning for hands...</span>
    </div>

    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const statusText = document.getElementById('status-text');
    const spinnerBox = document.getElementById('spinner-box');
    const btnStart = document.getElementById('btn-start');
    const btnStop = document.getElementById('btn-stop');
    const btnHelp = document.getElementById('btn-help');
    const tutorialOverlay = document.getElementById('tutorial-overlay');
    const tutorialContent = document.getElementById('tutorial-content');
    const feedbackPill = document.getElementById('feedback-pill');
    const feedbackIcon = document.getElementById('feedback-icon');
    const feedbackText = document.getElementById('feedback-text');

    let tutorialShown = false;

    const FLOWER_TYPES = [
      { name: 'Rose', emoji: '🌹', petals: 6, primaryColor: 'rgba(255, 30, 80, 0.95)', midColor: 'rgba(255, 70, 120, 0.7)', glow: '#ff1e50', pistil: '#fff4f8' },
      { name: 'Lotus', emoji: '🪷', petals: 8, primaryColor: 'rgba(255, 100, 200, 0.95)', midColor: 'rgba(200, 50, 255, 0.7)', glow: '#ff64c8', pistil: '#ffeb3b' },
      { name: 'Daisy', emoji: '🌼', petals: 12, primaryColor: 'rgba(255, 255, 255, 0.95)', midColor: 'rgba(255, 230, 150, 0.7)', glow: '#ffe600', pistil: '#ffaa00' },
      { name: 'Sakura', emoji: '🌸', petals: 5, primaryColor: 'rgba(255, 170, 200, 0.95)', midColor: 'rgba(255, 120, 160, 0.7)', glow: '#ffaac8', pistil: '#ffffff' }
    ];

    let currentFlowerIdx = 0;
    let cachedDockBtnEls = [];

    function renderFlowerDock() {
      const dock = document.getElementById('flower-dock');
      if (!dock) return;
      dock.innerHTML = '';
      FLOWER_TYPES.forEach((flower, idx) => {
        const btn = document.createElement('button');
        btn.className = `dock-btn ${idx === currentFlowerIdx ? 'active' : ''}`;
        btn.innerHTML = `<span class="dock-emoji">${flower.emoji}</span><span class="dock-label">${flower.name}</span>`;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          currentFlowerIdx = idx;
          renderFlowerDock();
        });
        dock.appendChild(btn);
      });
      cachedDockBtnEls = Array.from(dock.querySelectorAll('.dock-btn'));
    }

    renderFlowerDock();

    function showWelcomeAndTutorial() {
      return new Promise((resolve) => {
        const screens = [
          `<span class="cyber-badge">Welcome</span>
           <h2 class="brand-title" style="font-size:1.6rem;">🌸 Snehanshu Presents 🌸</h2>
           <p class="brand-subtitle">A Gesture-Driven Digital Garden Experience</p>
           <button class="cyber-btn-primary" id="tutorial-next">Continue</button>`,
          `<span class="cyber-badge">Gesture Guide</span>
           <h2 class="brand-title" style="font-size:1.5rem;">How It Works</h2>
           <ul class="tutorial-list">
             <li>🤏 Pinch thumb & index finger to bloom flowers</li>
             <li>🫶 Form a Heart with your hands (or cross wrists) for Bouquet Mode</li>
             <li>✊ Make a fist to close the flowers</li>
             <li>👉 Point at top dock or click directly to switch flower type</li>
             <li>😊 Smile at camera for a little surprise</li>
           </ul>
           <button class="cyber-btn-primary" id="tutorial-start">Start Blooming</button>`
        ];

        let idx = 0;

        function paint() {
          tutorialContent.innerHTML = screens[idx];
          const btn = tutorialContent.querySelector('button');
          btn.addEventListener('click', () => {
            idx++;
            if (idx < screens.length) {
              paint();
            } else {
              tutorialOverlay.style.display = 'none';
              resolve();
            }
          });
        }

        tutorialOverlay.style.display = 'block';
        paint();
      });
    }

    if (btnHelp) {
      btnHelp.addEventListener('click', () => {
        showWelcomeAndTutorial();
      });
    }

    if (!ctx.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
        this.beginPath();
        this.moveTo(x + r.tl, y);
        this.lineTo(x + w - r.tr, y);
        this.arcTo(x + w, y, x + w, y + r.tr, r.tr);
        this.lineTo(x + w, y + h - r.br);
        this.arcTo(x + w, y + h, x + w - r.br, y + h, r.br);
        this.lineTo(x + r.bl, y + h);
        this.arcTo(x, y + h, x, y + h - r.bl, r.bl);
        this.lineTo(x, y + r.tl);
        this.arcTo(x, y, x + r.tl, y, r.tl);
        this.closePath();
        return this;
      };
    }

    const FINGERTIPS = [4, 8, 12, 16, 20];
    const FINGER_MCP = [2, 5, 9, 13, 17];

    const CONFIG = {
      smoothingRate: 0.22,
      smileSmoothingRate: 0.18,
      smileRatioMin: 0.38,
      smileRatioMax: 0.48,
      fistTipRatioThreshold: 1.25,
      pinchRatioMin: 0.32,
      pinchRatioMax: 1.30,
      airTapPinchFactor: 0.35,
      airTapCooldownMs: 400
    };

    let smoothSmile = 0;
    let lastTapTime = 0;
    let smoothBouquet = 0;
    let prevBouquetActive = false;

    class Particle {
      constructor(x, y, color, isBurst = false, isShatter = false) {
        this.x = x;
        this.y = y;
        this.isShatter = isShatter;

        if (isShatter) {
          const angle = (Math.random() - 0.5) * Math.PI * 1.5 - Math.PI / 2;
          const speed = 0.8 + Math.random() * 2.8;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.size = 2.0 + Math.random() * 3.2;
          this.alpha = 1.0;
          this.decay = 0.012 + Math.random() * 0.012;
          this.rotation = Math.random() * Math.PI * 2;
          this.rotSpeed = (Math.random() - 0.5) * 0.15;
        } else {
          const angle = isBurst ? Math.random() * Math.PI * 2 : -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
          const speed = isBurst ? 1.5 + Math.random() * 4.0 : 0.4 + Math.random() * 1.5;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed - (isBurst ? 0 : 0.3);
          this.size = (1.5 + Math.random() * 3.0) * (isBurst ? 1.4 : 1.0);
          this.alpha = 1.0;
          this.decay = isBurst ? 0.012 + Math.random() * 0.015 : 0.008 + Math.random() * 0.015;
        }
        this.color = color || '#2ee6a6';
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.isShatter) {
          this.vy += 0.025;
          this.vx *= 0.96;
          this.rotation += this.rotSpeed;
        } else {
          this.vy -= 0.012;
          this.vx *= 0.98;
        }
        this.alpha -= this.decay;
      }
      draw(c) {
        if (this.alpha <= 0) return;
        c.save();
        c.globalAlpha = Math.max(0, this.alpha);
        c.translate(this.x, this.y);

        if (this.isShatter) {
          c.rotate(this.rotation);
          c.beginPath();
          c.ellipse(0, 0, this.size * 1.4, this.size * 0.7, 0, 0, Math.PI * 2);
        } else {
          c.beginPath();
          c.arc(0, 0, this.size, 0, Math.PI * 2);
        }
        c.fillStyle = this.color;
        c.shadowColor = this.color;
        c.shadowBlur = this.isShatter ? 12 : 10;
        c.fill();
        c.restore();
      }
    }

    const particles = [];

    function spawnParticles(x, y, color, count = 1, isBurst = false, isShatter = false) {
      if (particles.length > 350) return;
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, isBurst, isShatter));
      }
    }

    const handState = [
      { smoothBloom: 0, smoothGrow: 0, wasBlooming: false },
      { smoothBloom: 0, smoothGrow: 0, wasBlooming: false }
    ];

    let latestHandResults = null;
    let latestFaceResults = null;
    let mediaStream = null;
    let appRunning = false;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function dist(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    function drawNeonRibbon(x, y, radius, time) {
      if (radius <= 2) return;
      ctx.save();
      ctx.translate(x, y);

      ctx.beginPath();
      ctx.arc(0, 0, Math.max(8, radius), 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(230, 57, 104, 0.9)';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#e63968';
      ctx.shadowBlur = 20;
      ctx.stroke();

      const pulse = Math.sin(time * 0.006) * 3;
      ctx.beginPath();
      ctx.arc(0, 0, Math.max(4, radius * 0.65 + pulse), 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(46, 230, 166, 0.95)';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#2ee6a6';
      ctx.shadowBlur = 15;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(-radius * 0.7, radius * 0.35, radius * 0.65, radius * 0.3, -Math.PI / 4, 0, Math.PI * 2);
      ctx.ellipse(radius * 0.7, radius * 0.35, radius * 0.65, radius * 0.3, Math.PI / 4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(230, 57, 104, 0.45)';
      ctx.shadowColor = '#e63968';
      ctx.shadowBlur = 14;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, Math.max(6, radius * 0.3), 0, Math.PI * 2);
      ctx.fillStyle = '#e63968';
      ctx.shadowColor = '#e63968';
      ctx.shadowBlur = 18;
      ctx.fill();

      ctx.restore();
    }

    function drawFlower(x, y, maxRadius, bloomProgress, flowerConfig, time) {
      if (bloomProgress <= 0.05) return;

      if (Math.random() < 0.25) {
        spawnParticles(x, y, flowerConfig.glow, 1, false);
      }

      const numPetals = flowerConfig.petals;
      const baseRadius = maxRadius * bloomProgress;

      ctx.save();
      ctx.translate(x, y);

      for (let i = 0; i < numPetals; i++) {
        const angle = (i * (Math.PI * 2)) / numPetals + Math.sin(time * 0.003 + i) * 0.08;
        const petalLen = baseRadius * 1.5;
        const petalWidth = baseRadius * (numPetals > 8 ? 0.35 : 0.55);

        ctx.save();
        ctx.rotate(angle);

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-petalWidth, petalLen * 0.4, -petalWidth * 0.8, petalLen, 0, petalLen * 1.2);
        ctx.bezierCurveTo(petalWidth * 0.8, petalLen, petalWidth, petalLen * 0.4, 0, 0);

        const grad = ctx.createLinearGradient(0, 0, 0, petalLen);
        grad.addColorStop(0, flowerConfig.primaryColor);
        grad.addColorStop(0.6, flowerConfig.midColor);
        grad.addColorStop(1, 'rgba(255, 255, 255, 0.15)');

        ctx.fillStyle = grad;
        ctx.shadowColor = flowerConfig.glow;
        ctx.shadowBlur = 15;
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(0, 0, baseRadius * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = flowerConfig.pistil;
      ctx.shadowColor = flowerConfig.glow;
      ctx.shadowBlur = 20;
      ctx.fill();

      ctx.restore();
    }

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const time = performance.now();

      if (video.readyState >= 2) {
        ctx.save();
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, w, h);
        ctx.restore();
      } else {
        ctx.fillStyle = '#080910';
        ctx.fillRect(0, 0, w, h);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      if (latestFaceResults && latestFaceResults.multiFaceLandmarks && latestFaceResults.multiFaceLandmarks.length > 0) {
        const facePts = latestFaceResults.multiFaceLandmarks[0].map(p => ({ x: (1 - p.x) * w, y: p.y * h }));

        const mouthWidth = dist(facePts[61], facePts[291]);
        const faceWidth = dist(facePts[234], facePts[454]);
        const smileRatio = mouthWidth / (faceWidth || 1);

        let targetSmile = (smileRatio - CONFIG.smileRatioMin) / (CONFIG.smileRatioMax - CONFIG.smileRatioMin);
        targetSmile = Math.max(0, Math.min(1, targetSmile));

        smoothSmile += (targetSmile - smoothSmile) * CONFIG.smileSmoothingRate;
      } else {
        smoothSmile += (0 - smoothSmile) * CONFIG.smileSmoothingRate;
      }

      let targetBouquet = 0;
      let handData = [];

      if (latestHandResults && latestHandResults.multiHandLandmarks && latestHandResults.multiHandLandmarks.length > 0) {
        latestHandResults.multiHandLandmarks.forEach((landmarks, handIdx) => {
          const state = handState[handIdx] || (handState[handIdx] = { smoothBloom: 0, smoothGrow: 0, wasBlooming: false });

          const pts = landmarks.map(p => ({ x: (1 - p.x) * w, y: p.y * h }));
          const wrist = pts[0];
          const thumbTip = pts[4];
          const indexTip = pts[8];
          const middleMcp = pts[9];

          const palmHeight = Math.max(15, dist(wrist, middleMcp));
          const palmCenter = { x: (wrist.x + middleMcp.x) / 2, y: (wrist.y + middleMcp.y) / 2 };

          const pinchDist = dist(thumbTip, indexTip);
          const isAirTapping = pinchDist < palmHeight * CONFIG.airTapPinchFactor;

          let totalTipDist = 0;
          FINGERTIPS.forEach(tipIdx => {
            totalTipDist += dist(wrist, pts[tipIdx]) / palmHeight;
          });
          const avgTipRatio = totalTipDist / FINGERTIPS.length;
          const isFist = avgTipRatio < CONFIG.fistTipRatioThreshold;

          let targetBloom = 0;
          let targetGrow = 0;

          if (isFist) {
            if (state.wasBlooming || state.smoothBloom > 0.3) {
              state.wasBlooming = false;
              const activeFlower = FLOWER_TYPES[currentFlowerIdx];
              FINGERTIPS.forEach(tipIdx => {
                const tip = pts[tipIdx];
                spawnParticles(tip.x, tip.y, activeFlower.glow, 6, false, true);
                spawnParticles(tip.x, tip.y, activeFlower.primaryColor, 5, false, true);
              });
              state.smoothBloom = 0;
              state.smoothGrow = 0;
              targetBloom = 0;
              targetGrow = 0;
            }
          } else {
            if (state.smoothBloom > 0.3) {
              state.wasBlooming = true;
            }
            const pinchRatio = pinchDist / palmHeight;
            targetBloom = (pinchRatio - CONFIG.pinchRatioMin) / (CONFIG.pinchRatioMax - CONFIG.pinchRatioMin);
            targetBloom = Math.max(0, Math.min(1, targetBloom));
            targetGrow = Math.max(0.1, targetBloom);
          }

          state.smoothBloom += (targetBloom - state.smoothBloom) * CONFIG.smoothingRate;
          state.smoothGrow += (targetGrow - state.smoothGrow) * CONFIG.smoothingRate;

          handData.push({
            handIdx,
            landmarks,
            pts,
            wrist,
            middleMcp,
            palmCenter,
            palmHeight,
            indexTip,
            isAirTapping,
            state
          });
        });

        // Hit-test index finger tips against top flower dock mathematically without DOM queries
        const buttonWidth = 60;
        const buttonHeight = 60;
        const totalBarWidth = FLOWER_TYPES.length * (buttonWidth + 12);
        const startX = (w - totalBarWidth) / 2;
        const buttonY = 16;

        let anyHandHoveringDock = false;

        handData.forEach(h => {
          let isHandHovering = false;
          FLOWER_TYPES.forEach((_, idx) => {
            const btnX = startX + idx * (buttonWidth + 12);
            const isHovered = (
              h.indexTip.x >= btnX &&
              h.indexTip.x <= btnX + buttonWidth &&
              h.indexTip.y >= buttonY &&
              h.indexTip.y <= buttonY + buttonHeight
            );

            if (isHovered) {
              isHandHovering = true;
              anyHandHoveringDock = true;
              if (cachedDockBtnEls[idx]) cachedDockBtnEls[idx].classList.add('hovered');

              if (h.isAirTapping && time - lastTapTime > CONFIG.airTapCooldownMs) {
                currentFlowerIdx = idx;
                lastTapTime = time;
                renderFlowerDock();
              }
            }
          });

          if (isHandHovering) {
            h.state.smoothBloom += (0 - h.state.smoothBloom) * CONFIG.smoothingRate;
          }
        });

        if (!anyHandHoveringDock && cachedDockBtnEls.length > 0) {
          cachedDockBtnEls.forEach(btnEl => btnEl.classList.remove('hovered'));
        }

        if (handData.length === 2) {
          const h0 = handData[0];
          const h1 = handData[1];
          const thumbDist = dist(h0.pts[4], h1.pts[4]);
          const indexDist = dist(h0.pts[8], h1.pts[8]);
          const wristDist = dist(h0.wrist, h1.wrist);
          const avgPalmHeight = (h0.palmHeight + h1.palmHeight) / 2;

          const isHeartHands = (thumbDist < 100 || thumbDist < avgPalmHeight * 1.1) &&
                               (indexDist < 100 || indexDist < avgPalmHeight * 1.1);
          const isCrossedWrists = wristDist < 120 || wristDist < avgPalmHeight * 1.3;

          if (isHeartHands || isCrossedWrists) {
            targetBouquet = 1.0;
          } else {
            const heartProx = Math.min(thumbDist + indexDist, wristDist * 1.5);
            const maxThresh = Math.max(220, avgPalmHeight * 2.5);
            if (heartProx < maxThresh) {
              targetBouquet = Math.max(0, Math.min(1, (maxThresh - heartProx) / (maxThresh * 0.6)));
            }
          }
        }

        for (let i = handData.length; i < handState.length; i++) {
          handState[i].smoothBloom += (0 - handState[i].smoothBloom) * CONFIG.smoothingRate;
          handState[i].smoothGrow += (0 - handState[i].smoothGrow) * CONFIG.smoothingRate;
        }
      } else {
        handState.forEach(state => {
          state.smoothBloom += (0 - state.smoothBloom) * CONFIG.smoothingRate;
          state.smoothGrow += (0 - state.smoothGrow) * CONFIG.smoothingRate;
        });
      }

      smoothBouquet += (targetBouquet - smoothBouquet) * CONFIG.smoothingRate;

      const activeFlower = FLOWER_TYPES[currentFlowerIdx];

      // Update Feedback Pill UI
      if (appRunning && feedbackPill && feedbackText) {
        feedbackPill.style.display = 'flex';
        if (handData.length === 2) {
          feedbackIcon.innerText = '🫶';
          feedbackText.innerText = smoothBouquet > 0.3 ? 'Bouquet Mode Active 💐' : '2 Hands Detected • Form Heart';
        } else if (handData.length === 1) {
          const bloomPct = Math.round(handData[0].state.smoothBloom * 100);
          feedbackIcon.innerText = '🤏';
          feedbackText.innerText = `Hand 1 Active • Bloom ${bloomPct}%`;
        } else {
          feedbackIcon.innerText = '✋';
          feedbackText.innerText = 'Scanning for hands...';
        }
      }

      // Draw index finger air-tap cursors
      handData.forEach(h => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(h.indexTip.x, h.indexTip.y, h.isAirTapping ? 12 : 8, 0, Math.PI * 2);
        ctx.fillStyle = h.isAirTapping ? '#e63968' : '#2ee6a6';
        ctx.shadowColor = h.isAirTapping ? '#e63968' : '#2ee6a6';
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.restore();
      });

      if (handData.length > 0) {
        if (handData.length === 2 && smoothBouquet > 0.05) {
          const centralPoint = {
            x: (handData[0].palmCenter.x + handData[1].palmCenter.x) / 2,
            y: (handData[0].palmCenter.y + handData[1].palmCenter.y) / 2
          };
          const avgPalmHeight = (handData[0].palmHeight + handData[1].palmHeight) / 2;

          if (smoothBouquet > 0.3 && !prevBouquetActive) {
            prevBouquetActive = true;
            spawnParticles(centralPoint.x, centralPoint.y, '#ffd700', 30, true);
            spawnParticles(centralPoint.x, centralPoint.y, activeFlower.glow, 15, true);
          } else if (smoothBouquet <= 0.1) {
            prevBouquetActive = false;
          }

          drawNeonRibbon(centralPoint.x, centralPoint.y, avgPalmHeight * 0.45 * smoothBouquet, time);

          const allFingers = [];
          handData.forEach(h => {
            FINGERTIPS.forEach((tipIdx, fIdx) => {
              const tip = h.pts[tipIdx];
              const mcp = h.pts[FINGER_MCP[fIdx]];
              allFingers.push({
                tip,
                mcp,
                wrist: h.wrist,
                state: h.state,
                handIdx: h.handIdx
              });
            });
          });

          allFingers.sort((a, b) => a.tip.x - b.tip.x);

          const maxGrow = Math.max(handData[0].state.smoothGrow, handData[1].state.smoothGrow, 0.75);
          const maxBloom = Math.max(handData[0].state.smoothBloom, handData[1].state.smoothBloom, 0.85);
          const avgGrow = maxGrow;
          const avgBloom = maxBloom;
          const flowerMaxSize = avgPalmHeight * 0.5;

          allFingers.forEach((finger, i) => {
            const singleTargetX = finger.wrist.x + (finger.tip.x - finger.wrist.x) * finger.state.smoothGrow;
            const singleTargetY = finger.wrist.y + (finger.tip.y - finger.wrist.y) * finger.state.smoothGrow;

            const archAngle = -Math.PI / 2 + ((i - 4.5) / 4.5) * (Math.PI * 0.38);
            const bouquetRadius = avgPalmHeight * 2.3 * Math.max(0.15, avgGrow);
            const bouquetTargetX = centralPoint.x + Math.cos(archAngle) * bouquetRadius;
            const bouquetTargetY = centralPoint.y + Math.sin(archAngle) * bouquetRadius;

            const startX = finger.wrist.x + (centralPoint.x - finger.wrist.x) * smoothBouquet;
            const startY = finger.wrist.y + (centralPoint.y - finger.wrist.y) * smoothBouquet;

            const targetX = singleTargetX + (bouquetTargetX - singleTargetX) * smoothBouquet;
            const targetY = singleTargetY + (bouquetTargetY - singleTargetY) * smoothBouquet;

            const currentBloom = finger.state.smoothBloom + (avgBloom - finger.state.smoothBloom) * smoothBouquet;
            const currentGrow = finger.state.smoothGrow + (avgGrow - finger.state.smoothGrow) * smoothBouquet;

            if (currentGrow > 0.05) {
              ctx.save();
              ctx.shadowColor = smoothBouquet > 0.5 ? 'rgba(255, 43, 109, 0.9)' : 'rgba(0, 240, 255, 0.9)';
              ctx.shadowBlur = 14;
              ctx.lineWidth = 3;

              ctx.beginPath();
              ctx.moveTo(startX, startY);
              const ctrlX = (startX + targetX) / 2 + Math.sin(time * 0.002 + i) * (12 * (1 - smoothBouquet * 0.5));
              const ctrlY = (startY + targetY) / 2;

              ctx.quadraticCurveTo(ctrlX, ctrlY, targetX, targetY);

              const vineGrad = ctx.createLinearGradient(startX, startY, targetX, targetY);
              vineGrad.addColorStop(0, smoothBouquet > 0.5 ? 'rgba(255, 43, 109, 0.3)' : 'rgba(0, 180, 255, 0.15)');
              vineGrad.addColorStop(1, smoothBouquet > 0.5 ? 'rgba(255, 120, 180, 0.95)' : 'rgba(0, 255, 230, 0.95)');
              ctx.strokeStyle = vineGrad;
              ctx.stroke();
              ctx.restore();
            }

            if (currentBloom > 0.05) {
              drawFlower(targetX, targetY, flowerMaxSize, currentBloom, activeFlower, time);
            }
          });

          if (avgBloom > 0.15) {
            ctx.save();
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, avgBloom * 1.3)})`;
            ctx.shadowColor = '#ff2b6d';
            ctx.shadowBlur = 22;
            ctx.font = 'bold 28px "Space Grotesk", sans-serif';
            ctx.textAlign = 'center';
            const msg = smoothBouquet > 0.5 ? 'A bouquet for you 💐' : `For you ${activeFlower.emoji}`;
            ctx.fillText(msg, centralPoint.x, centralPoint.y + avgPalmHeight * 1.1);
            ctx.restore();
          }

        } else {
          handData.forEach(h => {
            if (h.state.smoothGrow > 0.05) {
              ctx.save();
              ctx.shadowColor = 'rgba(0, 240, 255, 0.9)';
              ctx.shadowBlur = 14;
              ctx.lineWidth = 3;

              FINGERTIPS.forEach((tipIdx, i) => {
                const tip = h.pts[tipIdx];
                const mcp = h.pts[FINGER_MCP[i]];

                const targetX = h.wrist.x + (tip.x - h.wrist.x) * h.state.smoothGrow;
                const targetY = h.wrist.y + (tip.y - h.wrist.y) * h.state.smoothGrow;

                ctx.beginPath();
                ctx.moveTo(h.wrist.x, h.wrist.y);
                const ctrlX = (h.wrist.x + mcp.x) / 2 + Math.sin(time * 0.002 + i) * 12;
                const ctrlY = (h.wrist.y + mcp.y) / 2;

                ctx.quadraticCurveTo(ctrlX, ctrlY, targetX, targetY);

                const vineGrad = ctx.createLinearGradient(h.wrist.x, h.wrist.y, targetX, targetY);
                vineGrad.addColorStop(0, 'rgba(0, 180, 255, 0.15)');
                vineGrad.addColorStop(1, 'rgba(0, 255, 230, 0.95)');
                ctx.strokeStyle = vineGrad;
                ctx.stroke();
              });
              ctx.restore();
            }

            if (h.state.smoothBloom > 0.05) {
              const flowerMaxSize = h.palmHeight * 0.5;
              FINGERTIPS.forEach((tipIdx) => {
                const tip = h.pts[tipIdx];
                const currentHeadX = h.wrist.x + (tip.x - h.wrist.x) * h.state.smoothGrow;
                const currentHeadY = h.wrist.y + (tip.y - h.wrist.y) * h.state.smoothGrow;

                drawFlower(currentHeadX, currentHeadY, flowerMaxSize, h.state.smoothBloom, activeFlower, time);
              });
            }

            if (h.state.smoothBloom > 0.2) {
              ctx.save();
              ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, h.state.smoothBloom * 1.2)})`;
              ctx.shadowColor = activeFlower.glow;
              ctx.shadowBlur = 18;
              ctx.font = 'bold 26px "Space Grotesk", sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText(`For you ${activeFlower.emoji}`, h.palmCenter.x, h.wrist.y + 60);
              ctx.restore();
            }
          });
        }
      }

      if (smoothSmile > 0.3) {
        ctx.save();
        ctx.fillStyle = `rgba(255, 183, 3, ${Math.min(1, smoothSmile * 1.5)})`;
        ctx.shadowColor = '#ffb703';
        ctx.shadowBlur = 24;
        ctx.font = 'bold 30px "Space Grotesk", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('happy you smiled ✨', w / 2, h - 80);
        ctx.restore();
      }

      if (appRunning) {
        requestAnimationFrame(render);
      }
    }

    let isProcessing = false;
    let frameCount = 0;

    async function initApp() {
      try {
        btnStart.disabled = true;
        if (spinnerBox) spinnerBox.style.display = 'flex';
        statusText.innerText = "Accessing webcam...";

        if (typeof navigator.mediaDevices === 'undefined' || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Webcam API not supported or blocked by browser security context.');
        }

        if (typeof Hands === 'undefined' || typeof FaceMesh === 'undefined') {
          throw new Error('Tracking models failed to load from CDN. Check your connection or ad blocker and reload.');
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        mediaStream = stream;

        video.srcObject = stream;
        await video.play();

        statusText.innerText = "Loading AI Vision Models...";

        const hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({
          maxNumHands: 2,
          modelComplexity: 1,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        hands.onResults((results) => { latestHandResults = results; });

        const faceMesh = new FaceMesh({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });
        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        faceMesh.onResults((results) => { latestFaceResults = results; });

        appRunning = true;

        async function runAI() {
          if (!appRunning) return;
          if (video.readyState >= 2 && !isProcessing) {
            isProcessing = true;
            try {
              frameCount++;
              await hands.send({ image: video });
              if (frameCount % 3 === 0) {
                await faceMesh.send({ image: video });
              }
            } catch (e) {
              console.warn('Inference error:', e);
            }
            isProcessing = false;
          }
          requestAnimationFrame(runAI);
        }

        runAI();
        overlay.style.display = 'none';
        render();

        if (!tutorialShown) {
          await showWelcomeAndTutorial();
          tutorialShown = true;
        }

        btnStop.style.display = 'block';

      } catch (err) {
        console.error('initApp Error:', err);
        btnStart.disabled = false;
        if (spinnerBox) spinnerBox.style.display = 'none';
        if (err.name === 'NotAllowedError') {
          statusText.innerHTML = `<span style="color: #ff3366;">Camera permission denied. Please allow camera access in browser settings.</span>`;
        } else if (err.name === 'NotFoundError') {
          statusText.innerHTML = `<span style="color: #ff3366;">No camera found. Please connect a webcam and retry.</span>`;
        } else {
          statusText.innerHTML = `<span style="color: #ff3366;">Error: ${err.message || err}</span>`;
        }
      }
    }

    function stopApp() {
      appRunning = false;
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      video.srcObject = null;
      latestHandResults = null;
      latestFaceResults = null;
      handState.forEach(s => { s.smoothBloom = 0; s.smoothGrow = 0; });
      smoothSmile = 0;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      btnStop.style.display = 'none';
      if (feedbackPill) feedbackPill.style.display = 'none';
      overlay.style.display = 'block';
      if (spinnerBox) spinnerBox.style.display = 'none';
      btnStart.disabled = false;
      statusText.innerText = "Click to start tracking";
    }

    window.initApp = initApp;
    window.stopApp = stopApp;

    if (btnStart) {
      btnStart.addEventListener('click', initApp);
    }
    if (btnStop) {
      btnStop.addEventListener('click', stopApp);
    }

    window.addEventListener('beforeunload', () => {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
    });
  </script>
</body>
</html>
